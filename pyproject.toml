[project]
name = "quant-research-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.4", "lightgbm>=4.0", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab", "matplotlib"]
deep = ["torch>=2.2"]

[tool.setuptools]
packages = ["harness"]
